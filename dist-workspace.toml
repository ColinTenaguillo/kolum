[workspace]
members = ["cargo:."]

# Config for 'dist'. Only the `kolum` crate ships: the others are its
# libraries (see [package.metadata.dist] in crates/kolum/Cargo.toml).
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# The Homebrew tap the formula is pushed to on each release: brew install
# ColinTenaguillo/tap/kolum. Pushing there needs HOMEBREW_TAP_TOKEN in this
# repository's secrets, a token with write access to the tap.
tap = "ColinTenaguillo/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

# dist's default image for Apple arm64 is macos-14, which GitHub no longer
# runs ("The configuration 'macos-14-arm64-us-default' is not supported").
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-26"
