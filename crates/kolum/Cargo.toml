[package]
name = "kolum"
description = "A kanban client for the terminal, with vim keys and a Telescope-style picker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

# `publish = false` hides the package from dist too; this puts it back,
# since the binaries from a tag are the release.
[package.metadata.dist]
dist = true

[[bin]]
name = "kolum"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
# Needed for EventStream, which ratatui's crossterm re-export does not
# expose. MUST track ratatui's crossterm version, or KeyEvent becomes two
# distinct types.
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures = "0.3"
# Avatars: decoded here, drawn by ratatui-image. Only the formats avatars
# come in (GitHub's PNG and JPEG, the demo's PNM).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "pnm", "gif", "webp"] }
kolum-app.workspace = true
kolum-domain.workspace = true
kolum-provider-fake.workspace = true
kolum-provider-jira = { path = "../kolum-provider-jira" }
kolum-provider-github = { path = "../kolum-provider-github" }
# Helix's matcher: ranks better than fuzzy-matcher, and matches on its own
# threads so typing never waits on a sort.
nucleo = "0.5"
# `unstable-rendered-line-info` is for Paragraph::line_count, which is how
# far a wrapped issue can scroll. Unstable in name; pinned with ratatui.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
serde.workspace = true
# Collects the settings serde would skip without a word: a misspelt key
# that silently does nothing is worse than an error on screen.
serde_ignored = "0.1"
time.workspace = true
tokio.workspace = true
# `preserve_order`: config problems are reported, and a key spelt twice is
# resolved, in the order the file has them.
toml = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

[dev-dependencies]
insta = "1"
kolum-app.workspace = true

[lints]
workspace = true
